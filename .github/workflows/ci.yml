name: Python quality checks

on:
  push:
    branches: ["master", "fix/security-reliability", "upgrade/production-quality"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint changed Python modules
        run: ruff check main.py security_utils.py test_security_utils.py --output-format=github
      - name: Compile Python files
        run: python -m compileall -q main.py generate_process.py text_to_audio.py config.py pipeline security_utils.py
      - name: Run unit tests
        run: python -m unittest discover -v
